name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Imagem Docker e smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: algoky:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sobe o container
        run: docker run -d --name algoky -p 3333:3333 --read-only --tmpfs /tmp -v algoky-data:/data algoky:ci
      - name: Espera ficar saudável
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' algoky)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "container não ficou saudável (status: $status)"; exit 1
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3333/api/health
          curl -fsS http://localhost:3333/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3333/app/trilha | grep -q 200
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"username":"ci_bot","password":"senha-do-ci-123"}' http://localhost:3333/api/auth/register
          curl -fsS -b jar -X PATCH -H 'content-type: application/json' \
            -d '{"status":"solved"}' http://localhost:3333/api/progress/two-sum | grep -q '"xpGained":10'
          docker exec algoky node scripts/backup.mjs
          docker restart algoky
          # espera o app subir de novo (o proxy do Docker reseta conexões até lá)
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:3333/api/health
          curl -fsS -b jar http://localhost:3333/api/dashboard | grep -q '"solved":1'
          echo "smoke test ok: dados persistiram após restart"
      - name: Logs do container
        if: always()
        run: docker logs algoky 2>&1 | tail -50
